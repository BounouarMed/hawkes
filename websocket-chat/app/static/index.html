<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; }
    header { background: #1e293b; padding: 1rem 1.5rem; border-bottom: 1px solid #334155; }
    header h1 { font-size: 1.25rem; color: #38bdf8; margin-bottom: 0.5rem; }
    #setup { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
    input { background: #0f172a; border: 1px solid #475569; color: #e2e8f0; padding: 0.4rem 0.75rem; border-radius: 6px; font-size: 0.9rem; outline: none; }
    input:focus { border-color: #38bdf8; }
    button { background: #0ea5e9; color: white; border: none; padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    button:hover { background: #38bdf8; }
    button:disabled { background: #334155; cursor: default; }
    #status { font-size: 0.8rem; color: #64748b; margin-left: auto; }
    #messages { flex: 1; overflow-y: auto; padding: 1rem 1.5rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .msg { display: flex; gap: 0.6rem; align-items: baseline; }
    .msg .time { font-size: 0.75rem; color: #475569; flex-shrink: 0; }
    .msg .user { font-weight: 600; color: #38bdf8; flex-shrink: 0; }
    .msg.system .user { color: #64748b; font-style: italic; }
    .msg .text { color: #cbd5e1; word-break: break-word; }
    #composer { display: flex; gap: 0.75rem; padding: 1rem 1.5rem; background: #1e293b; border-top: 1px solid #334155; }
    #msgInput { flex: 1; }
  </style>
</head>
<body>
  <header>
    <h1>WebSocket Chat</h1>
    <div id="setup">
      <input id="roomInput" placeholder="Room" value="general" style="width:110px">
      <input id="userInput" placeholder="Your name" style="width:120px">
      <button id="joinBtn" onclick="connect()">Join</button>
      <span id="status">Not connected</span>
    </div>
  </header>
  <div id="messages"></div>
  <div id="composer">
    <input id="msgInput" placeholder="Type a message and press Enter…" disabled>
    <button id="sendBtn" onclick="send()" disabled>Send</button>
  </div>
  <script>
    let ws = null;
    const $msg  = document.getElementById('messages');
    const $status = document.getElementById('status');
    const $input  = document.getElementById('msgInput');
    const $send   = document.getElementById('sendBtn');

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function addMsg(user, text, time, isSystem) {
      const d = document.createElement('div');
      d.className = 'msg' + (isSystem ? ' system' : '');
      d.innerHTML = `<span class="time">${esc(time)}</span><span class="user">${esc(user)}</span><span class="text">${esc(text)}</span>`;
      $msg.appendChild(d);
      $msg.scrollTop = $msg.scrollHeight;
    }

    function connect() {
      if (ws) { ws.close(); }
      const room = document.getElementById('roomInput').value.trim() || 'general';
      const user = document.getElementById('userInput').value.trim() || 'Anonymous';
      ws = new WebSocket(`ws://${location.host}/ws/${encodeURIComponent(room)}/${encodeURIComponent(user)}`);
      ws.onopen = () => {
        $status.textContent = `Connected · #${room} · ${user}`;
        $input.disabled = false;
        $send.disabled  = false;
        $input.focus();
      };
      ws.onmessage = (e) => {
        const d = JSON.parse(e.data);
        if (d.type === 'history') {
          $msg.innerHTML = '';
          d.messages.forEach(m => addMsg(m.user, m.text, m.timestamp, m.user === 'System'));
        } else {
          addMsg(d.user, d.text, d.timestamp, d.user === 'System');
        }
      };
      ws.onclose = () => {
        $status.textContent = 'Disconnected';
        $input.disabled = true;
        $send.disabled  = true;
      };
    }

    function send() {
      if (ws && $input.value.trim()) {
        ws.send($input.value.trim());
        $input.value = '';
      }
    }

    $input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
